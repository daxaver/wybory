<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wybór pieśni</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #0f0f0f;
      color: #f0f0f0;
      font-family: 'Inter', sans-serif;
      padding: 24px;
    }

    h2 {
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888;
      margin-bottom: 12px;
    }

    .panel {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }

    /* WYBRANE PIEŚNI */
    #lista-wybranych {
      min-height: 60px;
      margin-bottom: 16px;
    }

    .piesn-wybrana {
      display: flex;
      align-items: center;
      background: #2a2a2a;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      gap: 12px;
    }

    .handle {
      cursor: grab;
      color: #555;
      font-size: 18px;
      user-select: none;
      flex-shrink: 0;
    }

    .handle:active { cursor: grabbing; }

    .piesn-wybrana span {
      flex: 1;
      font-size: 15px;
    }

    .btn-usun {
      background: none;
      border: none;
      color: #666;
      cursor: pointer;
      font-size: 18px;
      padding: 0 4px;
      flex-shrink: 0;
    }

    .btn-usun:hover { color: #e55; }

    .przyciski-dolne {
      display: flex;
      gap: 10px;
    }

    button {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    .btn-zapisz {
      background: #4a9eff;
      color: white;
      flex: 1;
    }

    .btn-zapisz:hover { background: #3a8eef; }

    .btn-wyczysc {
      background: #333;
      color: #aaa;
    }

    .btn-wyczysc:hover { background: #444; }

    .btn-dodaj {
      background: #4a9eff;
      color: white;
      padding: 6px 14px;
      font-size: 13px;
    }

    /* WYSZUKIWARKA */
    #szukaj {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      background: #2a2a2a;
      color: #f0f0f0;
      font-size: 15px;
      margin-bottom: 14px;
      outline: none;
    }

    #szukaj:focus { background: #333; }

    /* LISTA WSZYSTKICH */
    .piesn-dostepna {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 6px;
      background: #2a2a2a;
      font-size: 15px;
    }

    .piesn-dostepna:hover { background: #333; }

    /* KOMUNIKAT STATUSU */
    #status {
      text-align: center;
      font-size: 13px;
      color: #888;
      margin-top: 8px;
      min-height: 20px;
    }

    /* LINK DO DODAJ PIESN */
    .nav-link {
      display: block;
      text-align: center;
      color: #4a9eff;
      text-decoration: none;
      font-size: 14px;
      margin-top: 8px;
    }

    .pusty {
      color: #555;
      font-size: 14px;
      text-align: center;
      padding: 16px;
    }
  </style>
</head>
<body>

  <!-- PANEL: WYBRANE PIEŚNI -->
  <div class="panel">
    <h2>Wybrane pieśni</h2>
    <div id="lista-wybranych"></div>
    <div class="przyciski-dolne">
      <button class="btn-wyczysc" onclick="wyczyscListe()">Wyczyść</button>
      <button class="btn-zapisz" onclick="zapiszWybor()">Zapisz</button>
    </div>
    <div id="status"></div>
  </div>

  <!-- PANEL: WSZYSTKIE PIEŚNI -->
  <div class="panel">
    <h2>Śpiewnik</h2>
    <input type="text" id="szukaj" placeholder="Szukaj pieśni..." oninput="filtrujPiesni()">
    <div id="lista-wszystkich"></div>
  </div>

  <a class="nav-link" href="https://daxaver.github.io/dodajpiesn">➕ Dodaj / edytuj pieśni</a>

  <script>
    const TOKEN = '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';
    const OWNER = 'daxaver';
    const REPO = 'daxaver.github.io';
    const API = 'https://api.github.com';

    let wszystkiePiesni = [];
    let wybranePiesni = [];
    let wyborSHA = null;

    // INICJALIZACJA
    async function init() {
      await Promise.all([zaladujWszystkie(), zaladujWybrane()]);
      renderWybrane();
      renderWszystkie();
    }

    // POBIERZ LISTĘ WSZYSTKICH PIEŚNI
    async function zaladujWszystkie() {
      const r = await fetch(`${API}/repos/${OWNER}/${REPO}/contents/piosenki`, {
        headers: { Authorization: `token ${TOKEN}` }
      });
      const pliki = await r.json();
      wszystkiePiesni = pliki
        .filter(p => p.type === 'file')
        .map(p => p.name.replace('.txt', ''))
        .sort();
    }

    // POBIERZ AKTUALNE WYBRANE
    async function zaladujWybrane() {
      const r = await fetch(`${API}/repos/${OWNER}/${REPO}/contents/wybor.txt`, {
        headers: { Authorization: `token ${TOKEN}` }
      });
      const data = await r.json();
      wyborSHA = data.sha;
      const tekst = atob(data.content.replace(/\n/g, ''));
      wybranePiesni = tekst.split('\n').map(l => l.trim()).filter(l => l);
    }

    // RENDERUJ WYBRANE
    function renderWybrane() {
      const lista = document.getElementById('lista-wybranych');
      if (wybranePiesni.length === 0) {
        lista.innerHTML = '<div class="pusty">Brak wybranych pieśni</div>';
        return;
      }
      lista.innerHTML = wybranePiesni.map((nazwa, i) => `
        <div class="piesn-wybrana" data-nazwa="${nazwa}">
          <span class="handle">☰</span>
          <span>${nazwa}</span>
          <button class="btn-usun" onclick="usunWybrana(${i})">✕</button>
        </div>
      `).join('');

      Sortable.create(lista, {
        handle: '.handle',
        animation: 150,
        onEnd: () => {
          wybranePiesni = [...lista.querySelectorAll('.piesn-wybrana')]
            .map(el => el.dataset.nazwa);
        }
      });
    }

    // RENDERUJ WSZYSTKIE / FILTROWANE
    function renderWszystkie(filtr = '') {
      const lista = document.getElementById('lista-wszystkich');
      const przefiltrowane = wszystkiePiesni.filter(n =>
        n.toLowerCase().includes(filtr.toLowerCase())
      );
      if (przefiltrowane.length === 0) {
        lista.innerHTML = '<div class="pusty">Brak wyników</div>';
        return;
      }
      lista.innerHTML = przefiltrowane.map(nazwa => `
        <div class="piesn-dostepna">
          <span>${nazwa}</span>
          <button class="btn-dodaj" onclick="dodajPiesn('${nazwa}')">Dodaj</button>
        </div>
      `).join('');
    }

    function filtrujPiesni() {
      renderWszystkie(document.getElementById('szukaj').value);
    }

    function dodajPiesn(nazwa) {
      if (!wybranePiesni.includes(nazwa)) {
        wybranePiesni.push(nazwa);
        renderWybrane();
        ustawStatus('Dodano: ' + nazwa);
      } else {
        ustawStatus('Pieśń już jest na liście');
      }
    }

    function usunWybrana(i) {
      wybranePiesni.splice(i, 1);
      renderWybrane();
    }

    function wyczyscListe() {
      wybranePiesni = [];
      renderWybrane();
    }

    async function zapiszWybor() {
      ustawStatus('Zapisywanie...');
      const zawartosc = btoa(unescape(encodeURIComponent(wybranePiesni.join('\n'))));
      const r = await fetch(`${API}/repos/${OWNER}/${REPO}/contents/wybor.txt`, {
        method: 'PUT',
        headers: {
          Authorization: `token ${TOKEN}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: 'Aktualizacja wyboru pieśni',
          content: zawartosc,
          sha: wyborSHA
        })
      });
      const data = await r.json();
      wyborSHA = data.content.sha;
      ustawStatus('✓ Zapisano');
    }

    function ustawStatus(tekst) {
      const el = document.getElementById('status');
      el.textContent = tekst;
      setTimeout(() => el.textContent = '', 3000);
    }

    init();
  </script>
</body>
</html>
